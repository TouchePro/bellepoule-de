<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src * data:;">
  <title>BellePoule</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f1729;
      color: #e8eaf0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      width: 520px;
      height: 460px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    body.fadeout { opacity: 0; }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 480px;
    }

    @keyframes icon-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      margin-bottom: 10px;
      animation: icon-breathe 2.5s ease-in-out infinite;
      image-rendering: -webkit-optimize-contrast;
    }

    .icon-placeholder {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #1e3a6e 0%, #3B5BDB 100%);
      animation: icon-breathe 2.5s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .title {
      font-size: 17px;
      font-weight: 600;
      color: #e8eaf0;
      letter-spacing: 0.02em;
      margin-bottom: 2px;
    }

    .subtitle {
      font-size: 10px;
      color: #3d4f72;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .version-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .version-text {
      font-size: 10px;
      color: #4a5a7a;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.05em;
    }

    .channel-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .channel-badge.main {
      background: rgba(59, 91, 219, 0.18);
      color: #6b84e8;
      border: 1px solid rgba(59, 91, 219, 0.3);
    }

    .channel-badge.dev {
      background: rgba(217, 119, 6, 0.18);
      color: #f59e0b;
      border: 1px solid rgba(217, 119, 6, 0.3);
    }

    /* ---- Épée SVG ---- */
    .epee-wrap {
      width: 340px;
      margin-bottom: 14px;
    }

    @keyframes draw-blade {
      from { stroke-dashoffset: 240; }
      to   { stroke-dashoffset: 0; }
    }

    @keyframes appear {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .blade {
      stroke-dasharray: 240;
      stroke-dashoffset: 240;
      animation: draw-blade 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .grip   { opacity: 0; animation: appear 0.3s ease-out 0.1s forwards; }
    .guard  { opacity: 0; animation: appear 0.3s ease-out 0.25s forwards; }
    .tip    { opacity: 0; animation: appear 0.15s ease-out 1.5s forwards; }

    /* ---- Sélecteur de langue ---- */
    .lang-label {
      font-size: 10px;
      color: #4a5a7a;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .lang-select-wrap {
      position: relative;
      width: 100%;
      margin-bottom: 14px;
    }

    .lang-select-wrap::after {
      content: '▾';
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #4a5a7a;
      pointer-events: none;
      font-size: 12px;
    }

    .lang-select {
      width: 100%;
      padding: 9px 36px 9px 12px;
      border-radius: 8px;
      border: 1px solid #1e2d4a;
      background: #121d33;
      color: #e8eaf0;
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      cursor: pointer;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .lang-select:hover {
      border-color: #2a3e66;
      background: #162035;
    }

    .lang-select:focus {
      border-color: #3B5BDB;
      background: rgba(59, 91, 219, 0.12);
    }

    .lang-select option {
      background: #121d33;
      color: #e8eaf0;
    }

    /* ---- Bouton confirmer ---- */
    .confirm-btn {
      width: 100%;
      padding: 9px 0;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #2F4AC4 0%, #3B5BDB 100%);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: opacity 0.15s;
      box-shadow: 0 0 16px rgba(59, 91, 219, 0.35);
    }

    .confirm-btn:hover { opacity: 0.88; }
    .confirm-btn:active { opacity: 0.75; }
  </style>
</head>
<body>
  <div class="container">
    <img id="app-icon" class="icon" alt="" onerror="this.style.display='none'; document.getElementById('icon-fb').style.display='flex';">
    <div id="icon-fb" class="icon-placeholder" style="display:none;">⚔️</div>

    <div class="title">BellePoule Modern</div>
    <div class="subtitle">Fencing Tournament Management</div>
    <div class="version-line">
      <span id="version-text" class="version-text">v1.0.0 · Build #0</span>
      <span id="channel-badge" class="channel-badge main">main</span>
    </div>

    <div class="epee-wrap">
      <svg width="340" height="30" viewBox="0 0 340 30" xmlns="http://www.w3.org/2000/svg">
        <circle class="grip" cx="12" cy="15" r="7" fill="#a07840"/>
        <rect class="grip" x="19" y="11" width="55" height="8" rx="4" fill="#c8a264"/>
        <line class="grip" x1="30" y1="11.5" x2="30" y2="19.5" stroke="#a07840" stroke-width="1.5"/>
        <line class="grip" x1="41" y1="11.5" x2="41" y2="19.5" stroke="#a07840" stroke-width="1.5"/>
        <line class="grip" x1="52" y1="11.5" x2="52" y2="19.5" stroke="#a07840" stroke-width="1.5"/>
        <line class="grip" x1="63" y1="11.5" x2="63" y2="19.5" stroke="#a07840" stroke-width="1.5"/>
        <ellipse class="guard" cx="84" cy="15" rx="13" ry="10" fill="rgba(59,91,219,0.15)" stroke="#4d77ff" stroke-width="2"/>
        <circle class="guard" cx="84" cy="15" r="3" fill="#4d77ff"/>
        <line class="blade" x1="97" y1="15" x2="331" y2="15"
              stroke="#a8c1ff" stroke-width="2" stroke-linecap="round"/>
        <polygon class="tip" points="331,12.5 339,15 331,17.5" fill="#a8c1ff"/>
      </svg>
    </div>

    <div class="lang-label" id="lang-label">Language / Langue</div>

    <div class="lang-select-wrap">
      <select class="lang-select" id="lang-select" onchange="selectLang(this.value)">
        <option value="fr">🇫🇷  Français</option>
        <option value="en">🇺🇸  English</option>
        <option value="de">🇩🇪  Deutsch</option>
        <option value="es">🇪🇸  Español</option>
        <option value="zh-HK">🇭🇰  繁體中文</option>
        <option value="br">🏴  Brezhoneg</option>
        <option value="ca">🟡  Català</option>
      </select>
    </div>

    <button class="confirm-btn" id="confirm-btn" onclick="confirm()">
      Entrer · Enter
    </button>
  </div>

  <script>
    const params = new URLSearchParams(location.search);

    // Icon
    const iconEl = document.getElementById('app-icon');
    let iconPath = params.get('icon') || '';
    if (iconPath && !/^file:/.test(iconPath)) {
      const norm = iconPath.replace(/\\/g, '/');
      iconPath = 'file://' + (norm.startsWith('/') ? '' : '/') + norm;
    }
    if (iconEl && iconPath) iconEl.src = iconPath;

    // Version + build + channel
    const version = params.get('version') || '?';
    const build = params.get('build') || '0';
    const channel = params.get('channel') || 'main';
    const versionEl = document.getElementById('version-text');
    const badgeEl = document.getElementById('channel-badge');
    if (versionEl) versionEl.textContent = 'v' + version + '  ·  Build #' + build;
    if (badgeEl) {
      badgeEl.textContent = channel;
      badgeEl.className = 'channel-badge ' + channel;
    }

    // Language selection
    var selectedLang = 'fr';

    function selectLang(lang) {
      selectedLang = lang;
      var sel = document.getElementById('lang-select');
      if (sel) sel.value = lang;
      updateConfirmLabel(lang);
    }

    var CONFIRM_LABELS = {
      fr: 'Entrer dans BellePoule',
      en: 'Enter BellePoule',
      de: 'BellePoule öffnen',
      es: 'Entrar en BellePoule',
      'zh-HK': '進入 BellePoule',
      br: 'Mont e BellePoule',
      ca: 'Entrar a BellePoule',
    };

    function updateConfirmLabel(lang) {
      var btn = document.getElementById('confirm-btn');
      if (btn) btn.textContent = CONFIRM_LABELS[lang] || CONFIRM_LABELS['en'];
    }

    function confirm() {
      if (window.splashAPI) {
        window.splashAPI.confirm(selectedLang);
      }
    }

    // Receive saved language from main process
    if (window.splashAPI) {
      window.splashAPI.onInit(function(savedLang) {
        selectLang(savedLang || 'fr');
      });
    }

    // Fallback: pre-select from query param
    var initLang = params.get('lang') || 'fr';
    selectLang(initLang);
  </script>
</body>
</html>
