name: Build German Release (macOS Intel)

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build-macos-x64:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build:ci

      - name: Package macOS Intel
        run: npx electron-builder --mac --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: bellepoule-de-macos-x64
          path: release/*.dmg
          retention-days: 14
