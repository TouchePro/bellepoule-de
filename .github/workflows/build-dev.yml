name: Build Dev Branch

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  increment-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      full_version: ${{ steps.version.outputs.full_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version from package.json
        id: version
        run: |
          # Get current version from package.json
          VERSION=$(node -p "require('./package.json').version" | sed 's/-build\..*//')
          CURRENT_BUILD=$(node -p "require('./package.json').version" | sed 's/.*-build\.//')

          # Use GitHub run number as build number
          NEW_BUILD=$GITHUB_RUN_NUMBER

          FULL_VERSION="${VERSION}-build.${NEW_BUILD}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$NEW_BUILD" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT

          echo "Current version: $VERSION"
          echo "Build number: $NEW_BUILD"
          echo "Full version: $FULL_VERSION"

      - name: Write version files
        run: |
          cat > version.json << EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "build": ${{ steps.version.outputs.build }},
            "date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.full_version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

          cat version.json

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add version.json package.json
          git diff --staged --quiet || git commit -m "🔖 Dev Build #${{ steps.version.outputs.build }}"
          git push || echo "Nothing to push"

  build-windows:
    needs: increment-version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            echo "npm ci failed, trying npm install..."
            npm install && break
            echo "Failed, waiting 10s before retry..."
            sleep 10
          done

      - name: Update version files
        run: |
          cat > version.json << EOF
          {
            "version": "${{ needs.increment-version.outputs.version }}",
            "build": ${{ needs.increment-version.outputs.build }},
            "date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ needs.increment-version.outputs.full_version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Update package.json for dev build
        shell: pwsh
        run: |
          $content = Get-Content package.json -Raw
          $content = $content -replace '"artifactName": "\$\{productName\}-\$\{version\}\.\$\{ext\}"', '"artifactName": "${productName}-dev-${version}.${ext}"'
          $content = $content -replace '"artifactName": "\$\{productName\}-\$\{version\}-setup\.\$\{ext\}"', '"artifactName": "${productName}-dev-${version}-setup.${ext}"'
          $content = $content -replace '"artifactName": "\$\{productName\}-\$\{version\}-portable\.\$\{ext\}"', '"artifactName": "${productName}-dev-${version}-portable.${ext}"'
          Set-Content package.json $content -NoNewline

      - name: Package with Electron Builder
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_on: error
          command: npx electron-builder --win portable --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-dev
          path: release/*-dev-*.exe
          retention-days: 7

