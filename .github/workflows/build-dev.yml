name: Build Dev Branch

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  increment-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      full_version: ${{ steps.version.outputs.full_version }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version from package.json
        id: version
        run: |
          # Get current version from package.json
          VERSION=$(node -p "require('./package.json').version" | sed 's/-build\..*//')
          CURRENT_BUILD=$(node -p "require('./package.json').version" | sed 's/.*-build\.//')

          # Use GitHub run number as build number
          NEW_BUILD=$GITHUB_RUN_NUMBER

          FULL_VERSION="${VERSION}-build.${NEW_BUILD}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$NEW_BUILD" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT

          echo "Current version: $VERSION"
          echo "Build number: $NEW_BUILD"
          echo "Full version: $FULL_VERSION"

      - name: Write version files
        run: |
          cat > version.json << EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "build": ${{ steps.version.outputs.build }},
            "date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.full_version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

          cat version.json

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add version.json package.json
          git diff --staged --quiet || git commit -m "🔖 Dev Build #${{ steps.version.outputs.build }}"
          git push || echo "Nothing to push"

  build-windows:
    needs: increment-version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            echo "npm ci failed, trying npm install..."
            npm install && break
            echo "Failed, waiting 10s before retry..."
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Update version files
        run: |
          node -e "const fs=require('fs');const v='${{ needs.increment-version.outputs.version }}';const b=${{ needs.increment-version.outputs.build }};const f='${{ needs.increment-version.outputs.full_version }}';fs.writeFileSync('version.json',JSON.stringify({version:v,build:b,date:new Date().toISOString()},null,2));const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=f;fs.writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Update package.json for dev build
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!pkg.build.portable) pkg.build.portable = {};
            pkg.build.portable.artifactName = '\${productName}-dev-\${version}-portable.\${ext}';
            if (!pkg.build.nsis) pkg.build.nsis = {};
            pkg.build.nsis.artifactName = '\${productName}-dev-\${version}-setup.\${ext}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Package with Electron Builder
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npx electron-builder --win portable --x64 && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe-dev
          path: release/*-dev-*.exe
          retention-days: 7

  build-macos-x64:
    needs: increment-version
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            echo "npm ci failed, trying npm install..."
            npm install && break
            echo "Failed, waiting 10s before retry..."
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Update version files
        run: |
          node -e "const fs=require('fs');const v='${{ needs.increment-version.outputs.version }}';const b=${{ needs.increment-version.outputs.build }};const f='${{ needs.increment-version.outputs.full_version }}';fs.writeFileSync('version.json',JSON.stringify({version:v,build:b,date:new Date().toISOString()},null,2));const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=f;fs.writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Update package.json for dev build
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.build.mac.artifactName = '\${productName}-dev-\${version}-\${arch}.\${ext}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Package with Electron Builder
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npx electron-builder --mac --x64 && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64-dmg-dev
          path: release/*-dev-*-x64.dmg
          retention-days: 7

  build-macos-arm64:
    needs: increment-version
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            echo "npm ci failed, trying npm install..."
            npm install && break
            echo "Failed, waiting 10s before retry..."
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Update version files
        run: |
          node -e "const fs=require('fs');const v='${{ needs.increment-version.outputs.version }}';const b=${{ needs.increment-version.outputs.build }};const f='${{ needs.increment-version.outputs.full_version }}';fs.writeFileSync('version.json',JSON.stringify({version:v,build:b,date:new Date().toISOString()},null,2));const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=f;fs.writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Update package.json for dev build
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.build.mac.artifactName = '\${productName}-dev-\${version}-\${arch}.\${ext}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Package with Electron Builder
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npx electron-builder --mac --arm64 && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-dmg-dev
          path: release/*-dev-*-arm64.dmg
          retention-days: 7

  build-linux-x64:
    needs: increment-version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            echo "npm ci failed, trying npm install..."
            npm install && break
            echo "Failed, waiting 10s before retry..."
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Update version files
        run: |
          node -e "const fs=require('fs');const v='${{ needs.increment-version.outputs.version }}';const b=${{ needs.increment-version.outputs.build }};const f='${{ needs.increment-version.outputs.full_version }}';fs.writeFileSync('version.json',JSON.stringify({version:v,build:b,date:new Date().toISOString()},null,2));const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=f;fs.writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Update package.json for dev build
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.build.linux.artifactName = '\${productName}-dev-\${version}-\${arch}.\${ext}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Package with Electron Builder
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npx electron-builder --linux AppImage --x64 && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-appimage-dev
          path: release/*-dev-*.AppImage
          retention-days: 7

  build-linux-arm64:
    needs: increment-version
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            echo "npm ci failed, trying npm install..."
            npm install && break
            echo "Failed, waiting 10s before retry..."
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Update version files
        run: |
          node -e "const fs=require('fs');const v='${{ needs.increment-version.outputs.version }}';const b=${{ needs.increment-version.outputs.build }};const f='${{ needs.increment-version.outputs.full_version }}';fs.writeFileSync('version.json',JSON.stringify({version:v,build:b,date:new Date().toISOString()},null,2));const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=f;fs.writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Update package.json for dev build
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.build.linux.artifactName = '\${productName}-dev-\${version}-\${arch}.\${ext}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Package with Electron Builder
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npx electron-builder --linux AppImage --arm64 && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-appimage-dev
          path: release/*-dev-*.AppImage
          retention-days: 7
          if-no-files-found: warn

  create-dev-release:
    needs:
      [
        increment-version,
        build-windows,
        build-macos-x64,
        build-macos-arm64,
        build-linux-x64,
        build-linux-arm64,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: builds

      - name: List downloaded files
        run: find builds -type f

      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing dev release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Delete release via API (handles immutable releases)
          RELEASE_ID=$(gh api repos/$REPO/releases/tags/dev --jq '.id' 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "Deleting release ID $RELEASE_ID"
            gh api -X DELETE repos/$REPO/releases/$RELEASE_ID
          fi
          # Delete tag
          git push origin :refs/tags/dev 2>/dev/null || true

      - name: Create Dev Release via gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(find builds -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" \) | tr '\n' ' ')
          gh release create dev \
            --title "🧪 BellePoule Modern Dev v${{ needs.increment-version.outputs.version }} Build #${{ needs.increment-version.outputs.build }}" \
            --notes "## 🧪 Version de Développement

          **Version**: \`${{ needs.increment-version.outputs.version }}\`
          **Build**: \`#${{ needs.increment-version.outputs.build }}\`

          **Ceci est une version de test !**

          Cette release contient les dernières modifications de la branche \`dev\` et est destinée aux tests.

          ### 📥 Téléchargements

          | Plateforme | Architecture | Fichier |
          |------------|--------------|---------|
          | **Windows** | x64 | \`.exe\` portable |
          | **macOS** | x64 | \`.dmg\` |
          | **macOS** | ARM64 | \`.dmg\` (Apple Silicon M1/M2/M3) |
          | **Linux** | x64 | \`.AppImage\` |
          | **Linux** | ARM64 | \`.AppImage\` (Raspberry Pi, etc.) |

          ### ⚠️ Notes
          - Cette version peut contenir des bugs
          - Les fonctionnalités sont en cours de développement

          ---
          **Build automatique** • Branche: \`dev\` • Commit: \`${{ github.sha }}\`" \
            --prerelease \
            --target dev \
            $FILES
